name: Rust

on:
  push:
    branches: [ "main", "1.0.2" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: both jobs only check out the repository and build, so the
# GITHUB_TOKEN needs nothing beyond read access to the contents.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel ]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test --verbose

      - name: Build (release)
        run: cargo build --release

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version lives in `toolchain`, not in the action's ref. Pinned as
      # `@1.85.0` the Dependabot actions updater treats it as a tag to bump, and
      # a "routine" bump to a newer ref would quietly build this job on a
      # different compiler while still calling itself the MSRV check. Kept in the
      # input, the minimum supported Rust version only moves when this line does.
      #
      # 1.85 is the floor because a dependency is published against the 2024
      # edition, which Cargo only understands from 1.85 on. The committed
      # Cargo.lock's version 4 format also needs at least 1.78, so 1.85 clears
      # both.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - name: Build on the minimum supported Rust version
        run: cargo build --verbose
