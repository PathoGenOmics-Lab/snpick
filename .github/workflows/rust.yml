name: Rust

on:
  push:
    branches: [ "main", "1.0.2" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-14, macos-15-intel ]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test --verbose

      - name: Build (release)
        run: cargo build --release

  msrv:
    name: MSRV 1.74
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The version lives in `toolchain`, not in the action's ref. Pinned as
      # `@1.74.0` the Dependabot actions updater treats it as a tag to bump, and
      # a "routine" bump to a newer ref would quietly build this job on a
      # different compiler while still calling itself the MSRV check. Kept in the
      # input, the minimum supported Rust version only moves when this line does.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.74.0"
      - name: Build on the minimum supported Rust version
        run: cargo build --verbose
