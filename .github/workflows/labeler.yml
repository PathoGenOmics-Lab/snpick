name: Label pull requests

# Puts the part-of-the-project labels on a pull request from the files it
# changes, so the labels are actually there when someone wants to filter by them.
# Configuration lives in .github/labeler.yml.
#
# `pull_request_target` rather than `pull_request` because a pull request from a
# fork gets a read-only token on `pull_request`, and labelling needs write. It
# runs the workflow from the base branch and never checks out or executes the
# pull request's code, which is what makes that safe here: this job reads the
# list of changed filenames and writes labels, and touches nothing from the
# branch it is labelling.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Apply labels from the files changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Off on purpose. With it on, the action removes any configured label
          # the files no longer justify, including one a person put there
          # deliberately.
          sync-labels: false
